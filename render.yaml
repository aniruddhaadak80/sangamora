# ─────────────────────────────────────────────────────────────────────────────
# sangamora — Render blueprint (three services from one repo, no API keys).
#
#   Render dashboard → New → Blueprint → point at this repository.
#
# Environment knobs for all services come from the `sangamora-sim` env group
# below — mirrors .env.example (all optional, nothing secret-shaped; the
# project has zero API keys by design). Tokens/platform creds always live in
# your Render account, never in this file.
# ─────────────────────────────────────────────────────────────────────────────

envGroups:
  - name: sangamora-sim
    envVars:
      - key: MELA_SEED
        value: "7331"

services:
  # 1/3 — web sandbox (Next 16, Bun-built).
  - type: web
    name: sangamora-web
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: cd apps/web && bunx next start -p $PORT
    healthCheckPath: /api/healthz
    envVars:
      - fromGroup: sangamora-sim
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sangamora-web.onrender.com

  # 2/3 — Python crowd-marshal agent service (FastAPI on uvicorn).
  - type: web
    name: sangamora-agents
    runtime: python
    plan: free
    buildCommand: pip install -r services/agents/requirements.txt
    # Entrypoint follows the services/agents layout — if the FastAPI app lives
    # at services/agents/app/main.py, switch to `app.main:app`.
    startCommand: uvicorn --app-dir services/agents main:app --host 0.0.0.0 --port 7332
    envVars:
      - fromGroup: sangamora-sim
      - key: AGENTS_PORT
        value: "7332"

  # 3/3 — Go SSE relay daemon (broadcasts live simulation ticks).
  - type: web
    name: sangamora-relay
    runtime: go
    plan: free
    buildCommand: go build -o sangamora-relay ./services/relay
    # Flags follow services/relay/main.go defaults (port 7331); adjust if the
    # daemon grows more options.
    startCommand: ./sangamora-relay
    envVars:
      - fromGroup: sangamora-sim
      - key: RELAY_PORT
        value: "7331"
