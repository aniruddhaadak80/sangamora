# deploy-vercel.yml — production deploy of apps/web via the Vercel prebuilt
# pipeline (pull env → build → deploy), triggered by pushes to main.
#
# REQUIRED SECRETS (repo Settings → Secrets and variables → Actions → Actions):
#   VERCEL_TOKEN        personal token — vercel.com/account/tokens
#   VERCEL_ORG_ID       org id, read from .vercel/org-id.json after `vercel link`
#   VERCEL_PROJECT_ID   project id, read from .vercel/project.json after `vercel link`
#
# Deployment credentials are NEVER committed to the repo (.env.example encodes
# them as plain {env:...} placeholders on purpose).
# The repository guard below makes this a no-op on forks/mirrors.
name: Deploy (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: vercel prebuilt deploy (production)
    if: github.repository == 'aniruddhaadak80/sangamora'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile

      - name: vercel pull (production)
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: vercel build
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: vercel deploy (prebuilt · prod)
        run: bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
