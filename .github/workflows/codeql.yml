# codeql.yml — static security analysis for the two first-party codebases:
# TypeScript/JavaScript (apps/web, packages/*) and Python (services/agents).
# Weekly on Saturdays at 06:00 UTC plus every PR / push to main.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 6"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5

      - name: setup python (python matrix leg)
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup bun (javascript-typescript matrix leg)
        if: matrix.language == 'javascript-typescript'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install js/ts dependencies (for dependency-graph)
        if: matrix.language == 'javascript-typescript'
        run: bun install --frozen-lockfile

      - name: install python dependencies (for dependency-graph)
        if: matrix.language == 'python'
        run: pip install -r services/agents/requirements.txt

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
