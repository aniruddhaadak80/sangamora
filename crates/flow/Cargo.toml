[package]
name = "flow_engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Deterministic BPR edge-flow kernel — the Rust twin of sangamora's TS core + Python marshal service."

[lib]
# cdylib = wasm-pack artifact for packages/core/src/flow-wasm/pkg;
# rlib    = lets integration tests (and the host build) use the pure kernel.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
